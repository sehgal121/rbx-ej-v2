<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flow Infinite — Eternal Journey</title>
    <meta
      name="description"
      content="Eternal Journey introduces Flow Infinite. Extrait de Parfum."
    />
    <link rel="icon" href="./assets/brand/ej-logo-lockup.png" type="image/png" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { min-height: 100%; background: #050506; color: #c8cdd4; }
      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: 8vh 6vw;
        font-family: 'Century Gothic', sans-serif;
        text-align: center;
      }
      img {
        width: min(52vmin, 340px);
        height: auto;
        margin-bottom: 2.4rem;
      }
      h1 {
        font-size: clamp(18px, 3vw, 28px);
        font-weight: 400;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: #f0f2f4;
      }
      a {
        display: inline-block;
        margin-top: 2.4rem;
        color: #c8cdd4;
        font-size: 11px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        text-decoration: none;
        border-bottom: 1px solid #3a3d42;
        padding-bottom: 4px;
      }
      a:hover { color: #e0b45c; border-color: #e0b45c; }
    </style>
  </head>
  <body>
    <main>
      <img src="./assets/brand/ej-logo-lockup.png" alt="Eternal Journey" width="1024" height="743" />
      <h1>Flow Infinite</h1>
      <a href="./">Return to Eternal Journey</a>
    </main>
  </body>
</html>
